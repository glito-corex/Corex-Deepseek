[package]
name = "deepseek-tauri"
version = "1.0.0"
description = "DeepSeek desktop application"
authors = ["Benjamin Burban"]
edition = "2021"

[lib]
name = "deepseek_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
